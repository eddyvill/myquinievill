<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIFA World Cup 2026™ Quiniela | Conectio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'montserrat': ['Montserrat', 'sans-serif'], 'inter': ['Inter', 'sans-serif'] },
                    colors: { 'fifa-blue': '#003B7B', 'fifa-gold': '#D4AF37', 'fifa-red': '#E31837', 'fifa-dark': '#0a0e27' },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0a0e27 0%, #1a1f4d 50%, #0f172a 100%); color: #e2e8f0; min-height: 100vh; padding-bottom: 90px; }
        .font-title { font-family: 'Montserrat', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .match-card { transition: all 0.3s ease; backdrop-filter: blur(10px); }
        .score-input { width: 2.8rem; height: 2.8rem; text-align: center; background: #0f172a; border: 2px solid #334155; color: white; border-radius: 0.5rem; font-size: 1.1rem; font-weight: bold; transition: all 0.2s ease; }
        @media (min-width: 640px) { .score-input { width: 3.5rem; height: 3.5rem; font-size: 1.25rem; } }
        .score-input:focus { outline: none; border-color: #D4AF37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.3); transform: scale(1.05); }
        .score-input:disabled { opacity: 0.4; cursor: not-allowed; background: #1e293b; border-color: #475569; }
        .exact-match { background: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981; }
        .winner-match { background: rgba(234, 179, 8, 0.15); border-left: 4px solid #eab308; }
        .lost-match { background: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; }
        .tab-btn { transition: all 0.2s; white-space: nowrap; }
        .tab-btn.active { background: #D4AF37; color: #0a0e27; font-weight: 800; border-color: #D4AF37; }
        .modal { background: rgba(10, 14, 39, 0.95); backdrop-filter: blur(10px); }
        .locked-badge { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        
        /* Estilos para la tabla de grupos */
        .standings-row:nth-child(1) td { border-left: 3px solid #10b981; } /* 1ro */
        .standings-row:nth-child(2) td { border-left: 3px solid #10b981; } /* 2do */
        .standings-row:nth-child(3) td { border-left: 3px solid #ef4444; } /* 3ro */
        .standings-row:nth-child(4) td { border-left: 3px solid #ef4444; } /* 4to */
    </style>
</head>
<body>

    <!-- Modal de Registro -->
    <div id="login-modal" class="modal fixed inset-0 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-800 p-8 rounded-2xl border-2 border-fifa-gold max-w-sm w-full text-center shadow-2xl">
            <i class="fas fa-trophy text-5xl text-fifa-gold mb-4"></i>
            <h2 class="text-2xl font-title font-black text-white mb-2">¡BIENVENIDO!</h2>
            <p class="text-slate-300 mb-6">Ingresa tu nombre para competir.</p>
            <input type="text" id="username-input" placeholder="Tu nombre o apodo" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white mb-4 focus:border-fifa-gold focus:outline-none" maxlength="20">
            <button onclick="window.registerUser()" class="w-full bg-fifa-gold hover:bg-yellow-400 text-fifa-dark font-bold py-3 rounded-xl transition">Entrar a la Quiniela</button>
        </div>
    </div>

    <!-- Header Compacto -->
    <header class="bg-fifa-dark border-b border-slate-700 sticky top-0 z-40 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-futbol text-2xl text-fifa-gold"></i>
                <div>
                    <h1 class="text-lg font-title font-black text-white leading-tight">WORLD CUP <span class="text-fifa-gold">2026</span></h1>
                    <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider" id="user-display">Conectando...</p>
                </div>
            </div>
            <button onclick="window.fetchRealResults()" class="bg-fifa-blue hover:bg-blue-700 text-white p-2 rounded-lg transition" title="Sincronizar con API">
                <i class="fas fa-sync-alt" id="sync-icon"></i>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 mt-4">
        <!-- Stats Rápidas -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-slate-800/50 rounded-xl p-3 border border-slate-700 text-center">
                <p class="text-xs text-slate-400 uppercase">Tu Puntaje</p>
                <p class="text-2xl font-title font-black text-fifa-gold" id="user-score">0</p>
            </div>
            <div class="bg-slate-800/50 rounded-xl p-3 border border-slate-700 text-center">
                <p class="text-xs text-slate-400 uppercase">Jugadores</p>
                <p class="text-2xl font-title font-black text-white" id="total-players">0</p>
            </div>
        </div>

        <!-- PESTAÑAS DE GRUPOS -->
        <div class="sticky top-[60px] z-30 bg-fifa-dark/95 backdrop-blur-md py-2 border-b border-slate-700 mb-4">
            <div class="flex overflow-x-auto gap-2 px-2 no-scrollbar" id="group-tabs"></div>
        </div>

        <!-- Contenedor de Partidos -->
        <section id="matches-container" class="space-y-3">
            <div class="text-center py-10 text-slate-400">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-fifa-gold"></i>
                <p>Cargando...</p>
            </div>
        </section>
    </main>

    <!-- MODAL: Clasificación de Jugadores (Quiniela) -->
    <div id="leaderboard-modal" class="modal fixed inset-0 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
        <div class="bg-slate-900 w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl border border-slate-700 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-xl font-title font-bold text-white"><i class="fas fa-trophy text-fifa-gold mr-2"></i>Quiniela</h3>
                <button onclick="window.closeModals()" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="overflow-y-auto p-4 flex-1">
                <table class="w-full text-sm">
                    <thead class="text-xs text-slate-400 uppercase bg-slate-800 sticky top-0">
                        <tr>
                            <th class="px-3 py-2 text-left">#</th>
                            <th class="px-3 py-2 text-left">Jugador</th>
                            <th class="px-3 py-2 text-center text-emerald-400"><i class="fas fa-bullseye"></i></th>
                            <th class="px-3 py-2 text-right text-fifa-gold font-bold">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-800"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL: Tabla de Grupos (Clasificación Real) -->
    <div id="standings-modal" class="modal fixed inset-0 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
        <div class="bg-slate-900 w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl border border-slate-700 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-xl font-title font-bold text-white"><i class="fas fa-table text-fifa-blue mr-2"></i>Tabla Grupo <span id="standings-group-title" class="text-fifa-gold">A</span></h3>
                <button onclick="window.closeModals()" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="overflow-y-auto p-4 flex-1">
                <table class="w-full text-xs sm:text-sm text-center">
                    <thead class="text-[10px] sm:text-xs text-slate-400 uppercase bg-slate-800 sticky top-0">
                        <tr>
                            <th class="px-1 py-2 text-left w-8">#</th>
                            <th class="px-1 py-2 text-left">Equipo</th>
                            <th class="px-1 py-2">PJ</th>
                            <th class="px-1 py-2 hidden sm:table-cell">G</th>
                            <th class="px-1 py-2 hidden sm:table-cell">E</th>
                            <th class="px-1 py-2 hidden sm:table-cell">P</th>
                            <th class="px-1 py-2">DG</th>
                            <th class="px-1 py-2 text-fifa-gold font-bold">PTS</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body" class="divide-y divide-slate-800"></tbody>
                </table>
                <p class="text-[10px] text-slate-500 mt-3 text-center">* PJ: Jugados, G: Ganados, E: Empates, P: Perdidos, DG: Diferencia de Gol</p>
            </div>
        </div>
    </div>

    <!-- BARRA DE NAVEGACIÓN INFERIOR (Estilo App) -->
    <nav class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-700 z-40 pb-safe">
        <div class="max-w-4xl mx-auto flex justify-around items-center h-16">
            <button onclick="window.openModal('leaderboard-modal')" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-fifa-gold transition">
                <i class="fas fa-trophy text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase tracking-wide">Quiniela</span>
            </button>
            <button onclick="window.openStandings()" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-fifa-blue transition">
                <i class="fas fa-table text-xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase tracking-wide">Grupos</span>
            </button>
        </div>
    </nav>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, getDocs, writeBatch, deleteDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // ==========================================
        // 1. CONFIGURACIÓN DE FIREBASE (¡REEMPLAZA ESTO!)
        // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyCfkCPAvcqtHJhit9aLMY02qX_hTKoTg4I",
        authDomain: "quinielaevill-mundial2026.firebaseapp.com",
        projectId: "quinielaevill-mundial2026",
        storageBucket: "quinielaevill-mundial2026.firebasestorage.app",
        messagingSenderId: "371407927074",
        appId: "1:371407927074:web:a9f1a9317c7b4ec089577b"
    };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let matchesData = [];
        let predictionsData = {};
        let activeGroup = 'A';

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const savedName = localStorage.getItem(`quiniela_name_${user.uid}`);
                if (savedName) {
                    document.getElementById('user-display').textContent = `👤 ${savedName}`;
                    document.getElementById('login-modal').classList.add('hidden');
                    initApp();
                } else {
                    document.getElementById('login-modal').classList.remove('hidden');
                }
            } else {
                await signInAnonymously(auth);
            }
        });

        window.registerUser = async function() {
            const name = document.getElementById('username-input').value.trim();
            if (!name) return alert("Ingresa un nombre");
            localStorage.setItem(`quiniela_name_${currentUser.uid}`, name);
            document.getElementById('user-display').textContent = `👤 ${name}`;
            document.getElementById('login-modal').classList.add('hidden');
            await setDoc(doc(db, "users", currentUser.uid), { name, uid: currentUser.uid, lastActive: new Date() }, { merge: true });
            initApp();
        };

        function initApp() {
            onSnapshot(collection(db, "matches"), (snapshot) => {
                matchesData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTabs();
                renderMatches();
            });
            onSnapshot(collection(db, "predictions"), (snapshot) => {
                predictionsData = {};
                snapshot.docs.forEach(doc => { predictionsData[doc.id] = doc.data(); });
                calculateAndRender();
            });
        }

        window.setGroup = function(group) {
            activeGroup = group;
            renderTabs();
            renderMatches();
        }

        function renderTabs() {
            const groups = ['A','B','C','D','E','F','G','H','I','J','K','L'];
            const container = document.getElementById('group-tabs');
            container.innerHTML = groups.map(g => `
                <button onclick="window.setGroup('${g}')" class="tab-btn px-4 py-2 rounded-full border border-slate-600 text-sm font-bold ${activeGroup === g ? 'active' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                    Grupo ${g}
                </button>
            `).join('');
        }

        function calculateAndRender() {
            if (matchesData.length === 0) return;
            let leaderboard = {};
            let userStats = { score: 0, exacts: 0 };

            matchesData.forEach(match => {
                const isFinished = match.status === "finished";
                const predKey = `${currentUser.uid}_${match.id}`;
                const myPred = predictionsData[predKey];
                match.myHome = myPred ? myPred.home : null;
                match.myAway = myPred ? myPred.away : null;
                match.resultClass = "";

                if (isFinished && myPred && myPred.home !== null && match.homeScore !== null) {
                    if (myPred.home === match.homeScore && myPred.away === match.awayScore) {
                        userStats.score += 4; userStats.exacts += 1; match.resultClass = "exact-match";
                    } else if ((myPred.home > myPred.away && match.homeScore > match.awayScore) || 
                               (myPred.home < myPred.away && match.homeScore < match.awayScore) || 
                               (myPred.home === myPred.away && match.homeScore === match.awayScore)) {
                        userStats.score += 3; match.resultClass = "winner-match";
                    } else {
                        match.resultClass = "lost-match";
                    }
                }

                Object.keys(predictionsData).forEach(key => {
                    if (!key.endsWith(`_${match.id}`)) return;
                    const [uid] = key.split('_');
                    const pred = predictionsData[key];
                    if (!leaderboard[uid]) leaderboard[uid] = { name: "...", exacts: 0, score: 0 };
                    if (isFinished && pred.home !== null && match.homeScore !== null) {
                        if (pred.home === match.homeScore && pred.away === match.awayScore) { leaderboard[uid].score += 4; leaderboard[uid].exacts += 1; }
                        else if ((pred.home > pred.away && match.homeScore > match.awayScore) || (pred.home < pred.away && match.homeScore < match.awayScore) || (pred.home === pred.away && match.homeScore === match.awayScore)) { leaderboard[uid].score += 3; }
                    }
                });
            });

            document.getElementById('user-score').textContent = userStats.score;
            getDocs(collection(db, "users")).then(snapshot => {
                snapshot.docs.forEach(doc => { if (leaderboard[doc.id]) leaderboard[doc.id].name = doc.data().name; });
                document.getElementById('total-players').textContent = Object.keys(leaderboard).length;
                const sorted = Object.values(leaderboard).sort((a, b) => b.score - a.score);
                renderLeaderboard(sorted);
                renderMatches(); 
            });
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboard-body');
            if (data.length === 0) { tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-500">Sin datos</td></tr>`; return; }
            tbody.innerHTML = data.map((p, i) => {
                const isMe = p.name === localStorage.getItem(`quiniela_name_${currentUser.uid}`);
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
                return `<tr class="${isMe ? 'bg-fifa-gold/10' : ''}">
                    <td class="px-3 py-3 font-bold">${medal}</td>
                    <td class="px-3 py-3 font-semibold text-white text-left">${p.name} ${isMe ? '<span class="text-fifa-gold text-xs">(Tú)</span>' : ''}</td>
                    <td class="px-3 py-3 text-center text-emerald-400">${p.exacts}</td>
                    <td class="px-3 py-3 text-right font-bold text-fifa-gold">${p.score}</td>
                </tr>`;
            }).join('');
        }

        // ==========================================
        // LÓGICA DE TABLA DE GRUPOS (CLASIFICACIÓN REAL)
        // ==========================================
        window.openStandings = function() {
            document.getElementById('standings-group-title').textContent = activeGroup;
            calculateGroupStandings(activeGroup);
            window.openModal('standings-modal');
        }

        function calculateGroupStandings(group) {
            const groupMatches = matchesData.filter(m => m.group === group && m.status === "finished");
            const teams = {};

            // Inicializar equipos del grupo
            const uniqueTeams = new Set();
            matchesData.filter(m => m.group === group).forEach(m => {
                uniqueTeams.add(m.homeTeam);
                uniqueTeams.add(m.awayTeam);
            });
            uniqueTeams.forEach(team => {
                teams[team] = { name: team, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, dg: 0, pts: 0 };
            });

            // Calcular estadísticas
            groupMatches.forEach(match => {
                const home = teams[match.homeTeam];
                const away = teams[match.awayTeam];
                const hScore = match.homeScore;
                const aScore = match.awayScore;

                home.pj++; away.pj++;
                home.gf += hScore; home.gc += aScore; home.dg = home.gf - home.gc;
                away.gf += aScore; away.gc += hScore; away.dg = away.gf - away.gc;

                if (hScore > aScore) {
                    home.g++; home.pts += 3;
                    away.p++;
                } else if (hScore < aScore) {
                    away.g++; away.pts += 3;
                    home.p++;
                } else {
                    home.e++; home.pts += 1;
                    away.e++; away.pts += 1;
                }
            });

            // Ordenar: 1. Puntos, 2. Diferencia de Gol, 3. Goles a Favor
            const sortedTeams = Object.values(teams).sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.dg !== a.dg) return b.dg - a.dg;
                return b.gf - a.gf;
            });

            const tbody = document.getElementById('standings-body');
            tbody.innerHTML = sortedTeams.map((t, i) => `
                <tr class="standings-row hover:bg-slate-800/50 transition">
                    <td class="px-1 py-3 text-left font-bold text-slate-300">${i + 1}</td>
                    <td class="px-1 py-3 text-left font-semibold text-white truncate max-w-[120px] sm:max-w-none">${t.name}</td>
                    <td class="px-1 py-3 text-slate-300">${t.pj}</td>
                    <td class="px-1 py-3 text-slate-300 hidden sm:table-cell">${t.g}</td>
                    <td class="px-1 py-3 text-slate-300 hidden sm:table-cell">${t.e}</td>
                    <td class="px-1 py-3 text-slate-300 hidden sm:table-cell">${t.p}</td>
                    <td class="px-1 py-3 font-semibold ${t.dg > 0 ? 'text-emerald-400' : t.dg < 0 ? 'text-red-400' : 'text-slate-300'}">${t.dg > 0 ? '+'+t.dg : t.dg}</td>
                    <td class="px-1 py-3 font-bold text-fifa-gold text-base">${t.pts}</td>
                </tr>
            `).join('');
        }

        function renderMatches() {
            const container = document.getElementById('matches-container');
            const groupMatches = matchesData.filter(m => m.group === activeGroup);
            const now = new Date();
            
            if (groupMatches.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500">No hay partidos en este grupo aún.</div>`;
                return;
            }

            container.innerHTML = groupMatches.map(match => {
                const matchTime = new Date(match.datetime);
                const isLocked = match.status === "finished" || now >= matchTime;
                const resultClass = match.resultClass || "border-slate-700 bg-slate-800/40";
                const actualScore = match.status === "finished" ? `<div class="mt-2 pt-2 border-t border-slate-700 text-center"><span class="text-fifa-gold text-xs font-bold uppercase"><i class="fas fa-flag-checkered mr-1"></i> Final: ${match.homeScore} - ${match.awayScore}</span></div>` : '';
                const myH = match.myHome !== null ? match.myHome : '';
                const myA = match.myAway !== null ? match.myAway : '';
                
                const lockBadge = isLocked ? `<div class="mt-2 text-center"><span class="locked-badge text-[10px] sm:text-xs font-bold uppercase px-2 py-1 rounded inline-flex items-center gap-1"><i class="fas fa-lock"></i> Cerrado</span></div>` : '';
                const clearBtn = !isLocked && (match.myHome !== null || match.myAway !== null) ? `
                    <button onclick="window.clearPrediction('${match.id}')" class="mt-3 w-full text-xs text-red-400 hover:text-red-300 hover:bg-red-900/20 py-2 rounded-lg transition flex items-center justify-center gap-2 border border-red-900/30">
                        <i class="fas fa-trash-alt"></i> Borrar pronóstico
                    </button>` : '';

                return `
                <div class="match-card rounded-xl p-3 border-2 ${resultClass}">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex-1 text-right min-w-0">
                            <div class="font-title font-bold text-sm sm:text-base text-white truncate">${match.homeTeam}</div>
                        </div>
                        <div class="flex items-center gap-1 sm:gap-2 bg-slate-900 px-2 py-2 sm:px-3 sm:py-3 rounded-lg border border-slate-600 shrink-0">
                            <input type="number" inputmode="numeric" pattern="[0-9]*" class="score-input" value="${myH}" onchange="window.savePrediction('${match.id}', 'home', this.value)" ${isLocked ? 'disabled' : ''}>
                            <span class="text-slate-500 font-bold text-xs sm:text-sm">-</span>
                            <input type="number" inputmode="numeric" pattern="[0-9]*" class="score-input" value="${myA}" onchange="window.savePrediction('${match.id}', 'away', this.value)" ${isLocked ? 'disabled' : ''}>
                        </div>
                        <div class="flex-1 text-left min-w-0">
                            <div class="font-title font-bold text-sm sm:text-base text-white truncate">${match.awayTeam}</div>
                        </div>
                    </div>
                    ${!isLocked ? `<div class="text-center mt-2"><span class="text-[10px] sm:text-xs text-slate-400 font-semibold bg-slate-900/50 px-2 py-1 rounded"><i class="far fa-clock mr-1"></i>${match.date}</span></div>` : ''}
                    ${lockBadge}
                    ${clearBtn}
                    ${actualScore}
                </div>`;
            }).join('');
        }

        window.savePrediction = async function(matchId, team, value) {
            if (!currentUser) return;
            const predKey = `${currentUser.uid}_${matchId}`;
            const currentPred = predictionsData[predKey] || { home: null, away: null };
            const newHome = team === 'home' ? (value === '' ? null : parseInt(value)) : currentPred.home;
            const newAway = team === 'away' ? (value === '' ? null : parseInt(value)) : currentPred.away;
            await setDoc(doc(db, "predictions", predKey), { userId: currentUser.uid, matchId, home: newHome, away: newAway, updatedAt: new Date() });
        };

        window.clearPrediction = async function(matchId) {
            if (!confirm("¿Borrar tu pronóstico para este partido?")) return;
            await deleteDoc(doc(db, "predictions", `${currentUser.uid}_${matchId}`));
        };

        window.openModal = function(id) { document.getElementById(id).classList.remove('hidden'); }
        window.closeModals = function() { 
            document.getElementById('leaderboard-modal').classList.add('hidden');
            document.getElementById('standings-modal').classList.add('hidden');
        }

        // ==========================================
        // INTEGRACIÓN REAL CON API (API-FOOTBALL)
        // ==========================================
        window.fetchRealResults = async function() {
            const icon = document.getElementById('sync-icon');
            icon.classList.add('fa-spin');
            
            console.log("🔄 Iniciando sincronización con API-Football (vía proxy)...");

            try {
                // Llamamos a NUESTRO proxy en lugar de directamente a la API
                const response = await fetch('https://api.quiniela.softandnet.site/api-proxy.php');
                const data = await response.json();
                
                if (data.error) {
                    console.error("❌ Error del proxy:", data.error);
                    alert("❌ Error en el servidor proxy. Revisa la consola.");
                    icon.classList.remove('fa-spin');
                    return;
                }

                if (!data.response || data.response.length === 0) {
                    console.warn("⚠️ La API no devolvió partidos.");
                    alert("ℹ️ No se encontraron partidos en la API.");
                    icon.classList.remove('fa-spin');
                    return;
                }

                console.log(`✅ API respondió con ${data.response.length} partidos.`);

                const batch = writeBatch(db);
                let updatedCount = 0;

                matchesData.forEach(localMatch => {
                    if (localMatch.status === "finished") return;

                    const cleanLocalHome = localMatch.homeTeam.replace(/[^\w\s]/gi, '').trim().toLowerCase();
                    const cleanLocalAway = localMatch.awayTeam.replace(/[^\w\s]/gi, '').trim().toLowerCase();

                    const apiMatch = data.response.find(api => {
                        const apiHome = api.teams.home.name.toLowerCase();
                        const apiAway = api.teams.away.name.toLowerCase();
                        const isHomeMatch = apiHome.includes(cleanLocalHome) || cleanLocalHome.includes(apiHome);
                        const isAwayMatch = apiAway.includes(cleanLocalAway) || cleanLocalAway.includes(apiAway);
                        return isHomeMatch && isAwayMatch;
                    });

                    if (apiMatch && apiMatch.fixture.status.short === 'FT') {
                        console.log(`🎯 Actualizando: ${localMatch.homeTeam} vs ${localMatch.awayTeam}`);
                        const matchRef = doc(db, "matches", localMatch.id);
                        batch.update(matchRef, {
                            status: "finished",
                            homeScore: apiMatch.goals.home,
                            awayScore: apiMatch.goals.away
                        });
                        updatedCount++;
                    }
                });

                if (updatedCount > 0) {
                    await batch.commit();
                    alert(`✅ ¡Éxito! Se actualizaron ${updatedCount} partidos.`);
                } else {
                    alert("ℹ️ Todo al día. No hay partidos finalizados aún.");
                }

            } catch (error) {
                console.error("💥 Error:", error);
                alert("❌ Error de conexión. Revisa la consola.");
            } finally {
                icon.classList.remove('fa-spin');
                calculateAndRender();
            }
        };
    </script>
</body>
</html>
