<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIFA World Cup 2026™ Quiniela | Softandnet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'montserrat': ['Montserrat', 'sans-serif'], 'inter': ['Inter', 'sans-serif'] },
                    colors: { 'fifa-blue': '#003B7B', 'fifa-gold': '#D4AF37', 'fifa-red': '#E31837', 'fifa-dark': '#0a0e27' },
                }
            }
        }
    </script>
</head>
<body>
    <!-- Modal de Registro -->
    <div id="login-modal" class="modal fixed inset-0 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-800 p-8 rounded-2xl border-2 border-fifa-gold max-w-sm w-full text-center shadow-2xl">
            <i class="fas fa-trophy text-5xl text-fifa-gold mb-4"></i>
            <h2 class="text-2xl font-title font-black text-white mb-2">¡BIENVENIDO!</h2>
            <p class="text-slate-300 mb-6">Ingresa tu nombre para competir.</p>
            <input type="text" id="username-input" placeholder="Tu nombre o apodo" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white mb-4 focus:border-fifa-gold focus:outline-none" maxlength="20">
            <button id="btn-register" class="w-full bg-fifa-gold hover:bg-yellow-400 text-fifa-dark font-bold py-3 rounded-xl transition">Entrar a la Quiniela</button>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-fifa-dark border-b border-slate-700 sticky top-0 z-40 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-futbol text-2xl text-fifa-gold"></i>
                <div>
                    <h1 class="text-lg font-title font-black text-white leading-tight">WORLD CUP <span class="text-fifa-gold">2026</span></h1>
                    <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider" id="user-display">Conectando...</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="btn-sync" class="bg-fifa-blue hover:bg-blue-700 text-white p-2 rounded-lg transition" title="Sincronizar con API">
                    <i class="fas fa-sync-alt" id="sync-icon"></i>
                </button>
                <button id="btn-admin" class="bg-red-600 hover:bg-red-700 text-white p-2 rounded-lg transition" title="Panel de Admin">
                    <i class="fas fa-user-shield"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 mt-4">
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-slate-800/50 rounded-xl p-3 border border-slate-700 text-center">
                <p class="text-xs text-slate-400 uppercase">Tu Puntaje</p>
                <p class="text-2xl font-title font-black text-fifa-gold" id="user-score">0</p>
            </div>
            <div class="bg-slate-800/50 rounded-xl p-3 border border-slate-700 text-center">
                <p class="text-xs text-slate-400 uppercase">Jugadores</p>
                <p class="text-2xl font-title font-black text-white" id="total-players">0</p>
            </div>
        </div>

        <div class="sticky top-[60px] z-30 bg-fifa-dark/95 backdrop-blur-md py-2 border-b border-slate-700 mb-4">
            <div class="flex overflow-x-auto gap-2 px-2 no-scrollbar" id="group-tabs"></div>
        </div>

        <section id="matches-container" class="space-y-3">
            <div class="text-center py-10 text-slate-400">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-fifa-gold"></i>
                <p>Cargando...</p>
            </div>
        </section>
    </main>

    <!-- Modales (Quiniela y Grupos) -->
    <div id="leaderboard-modal" class="modal fixed inset-0 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
        <div class="bg-slate-900 w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl border border-slate-700 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-xl font-title font-bold text-white"><i class="fas fa-trophy text-fifa-gold mr-2"></i>Quiniela</h3>
                <button class="btn-close-modal text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="overflow-y-auto p-4 flex-1">
                <table class="w-full text-sm"><thead class="text-xs text-slate-400 uppercase bg-slate-800 sticky top-0">
                    <tr><th class="px-3 py-2 text-left">#</th><th class="px-3 py-2 text-left">Jugador</th><th class="px-3 py-2 text-center text-emerald-400"><i class="fas fa-bullseye"></i></th><th class="px-3 py-2 text-right text-fifa-gold font-bold">Pts</th></tr>
                </thead><tbody id="leaderboard-body" class="divide-y divide-slate-800"></tbody></table>
            </div>
        </div>
    </div>

    <div id="standings-modal" class="modal fixed inset-0 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
        <div class="bg-slate-900 w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl border border-slate-700 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-xl font-title font-bold text-white"><i class="fas fa-table text-fifa-blue mr-2"></i>Clasificación <span id="standings-group-title" class="text-fifa-gold">A</span></h3>
                <button class="btn-close-modal text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="overflow-y-auto p-4 flex-1">
                <table class="w-full text-xs sm:text-sm text-center"><thead class="text-[10px] sm:text-xs text-slate-400 uppercase bg-slate-800 sticky top-0">
                    <tr><th class="px-1 py-2 text-left w-8">#</th><th class="px-1 py-2 text-left">Equipo</th><th class="px-1 py-2">PJ</th><th class="px-1 py-2 hidden sm:table-cell">G</th><th class="px-1 py-2 hidden sm:table-cell">E</th><th class="px-1 py-2 hidden sm:table-cell">P</th><th class="px-1 py-2">DG</th><th class="px-1 py-2 text-fifa-gold font-bold">PTS</th></tr>
                </thead><tbody id="standings-body" class="divide-y divide-slate-800"></tbody></table>
                <p class="text-[10px] text-slate-500 mt-3 text-center">* PJ: Jugados, G: Ganados, E: Empates, P: Perdidos, DG: Diferencia de Gol</p>
            </div>
        </div>
    </div>

    <!-- Barra de Navegación Inferior -->
    <nav class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-700 z-40 pb-safe">
        <div class="max-w-4xl mx-auto flex justify-around items-center h-16">
            <button id="nav-leaderboard" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-fifa-gold transition">
                <i class="fas fa-trophy text-xl mb-1"></i><span class="text-[10px] font-bold uppercase tracking-wide">Quiniela</span>
            </button>
            <button id="nav-standings" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-fifa-blue transition">
                <i class="fas fa-table text-xl mb-1"></i><span class="text-[10px] font-bold uppercase tracking-wide">Grupos</span>
            </button>
        </div>
    </nav>

    <!-- Carga de Módulos JS -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
