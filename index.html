<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Mundial 2026 | Evill</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .match-card { transition: all 0.3s ease; }
        .score-input { width: 3.5rem; text-align: center; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 0.375rem; font-size: 1.1rem; font-weight: bold; }
        .score-input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3); }
        .score-input:disabled { opacity: 0.5; cursor: not-allowed; }
        .exact-match { background-color: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981; }
        .winner-match { background-color: rgba(234, 179, 8, 0.15); border-left: 4px solid #eab308; }
        .lost-match { background-color: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; }
        .modal { background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Modal de Registro (Solo aparece la primera vez) -->
    <div id="login-modal" class="modal fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 max-w-sm w-full text-center shadow-2xl">
            <i class="fas fa-futbol text-5xl text-emerald-400 mb-4"></i>
            <h2 class="text-2xl font-bold text-white mb-2">¡Bienvenido a la Quiniela!</h2>
            <p class="text-slate-400 mb-6">Ingresa tu nombre para comenzar a predecir y competir en tiempo real.</p>
            <input type="text" id="username-input" placeholder="Tu nombre o apodo" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white mb-4 focus:border-emerald-500 focus:outline-none">
            <button onclick="registerUser()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition">
                Entrar a la Quiniela
            </button>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-opacity-90">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-emerald-400"><i class="fas fa-futbol mr-2"></i>Mundial 2026</h1>
                <p class="text-xs text-slate-400" id="user-display">Cargando...</p>
            </div>
            <div class="flex gap-2">
                <button onclick="seedDatabase()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg text-xs font-semibold transition" title="Solo para admin la primera vez">
                    <i class="fas fa-database"></i> Inicializar
                </button>
                <button onclick="fetchRealResults()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 sm:px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                    <i class="fas fa-sync-alt" id="sync-icon"></i> <span class="hidden sm:inline">Actualizar</span>
                </button>
            </div>
        </div
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">
        <!-- Leaderboard -->
        <section class="bg-slate-800 rounded-xl p-4 sm:p-6 mb-8 border border-slate-700 shadow-lg">
            <h2 class="text-lg sm:text-xl font-bold mb-4 text-white"><i class="fas fa-trophy text-yellow-400 mr-2"></i>Tabla en Vivo</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-slate-400 uppercase bg-slate-900/50">
                        <tr>
                            <th class="px-3 py-3 rounded-l-lg">#</th>
                            <th class="px-3 py-3">Jugador</th>
                            <th class="px-3 py-3 text-center">Exactos</th>
                            <th class="px-3 py-3 text-center">Ganador</th>
                            <th class="px-3 py-3 text-right rounded-r-lg text-emerald-400 font-bold">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-700">
                        <tr><td colspan="5" class="text-center py-4 text-slate-500">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Matches List -->
        <section id="matches-container" class="space-y-6">
            <div class="text-center py-10 text-slate-500">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-3"></i>
                <p>Cargando partidos...</p>
            </div>
        </section>
    </main>

    <!-- Leyenda -->
    <div class="fixed bottom-4 right-4 bg-slate-800 p-3 rounded-lg border border-slate-700 text-xs shadow-2xl z-30 hidden sm:block">
        <div class="flex items-center gap-2 mb-1"><div class="w-3 h-3 bg-emerald-500/20 border-l-2 border-emerald-500"></div> Exacto (4 pts)</div>
        <div class="flex items-center gap-2 mb-1"><div class="w-3 h-3 bg-yellow-500/20 border-l-2 border-yellow-500"></div> Ganador (3 pts)</div>
        <div class="flex items-center gap-2"><div class="w-3 h-3 bg-red-500/10 border-l-2 border-red-500"></div> Fallo (0 pts)</div>
    </div>

    <!-- FIREBASE SDK (Modular v9+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // ==========================================
        // 1. CONFIGURACIÓN DE FIREBASE
        // ==========================================
const firebaseConfig = {
    apiKey: "AIzaSyCfkCPAvcqtHJhit9aLMY02qX_hTKoTg4I",
    authDomain: "quinielaevill-mundial2026.firebaseapp.com",
    projectId: "quinielaevill-mundial2026",
    storageBucket: "quinielaevill-mundial2026.firebasestorage.app",
    messagingSenderId: "371407927074",
    appId: "1:371407927074:web:a9f1a9317c7b4ec089577b"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let matchesData = [];
        let predictionsData = {}; // { "userId_matchId": { home, away } }

        // ==========================================
        // 2. AUTENTICACIÓN
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // Verificar si ya tiene nombre guardado en localStorage
                const savedName = localStorage.getItem(`quiniela_name_${user.uid}`);
                if (savedName) {
                    document.getElementById('user-display').textContent = `Jugando como: ${savedName}`;
                    document.getElementById('login-modal').classList.add('hidden');
                    initApp();
                } else {
                    document.getElementById('login-modal').classList.remove('hidden');
                }
            }
        });

        window.registerUser = async function() {
            const name = document.getElementById('username-input').value.trim();
            if (!name) return alert("Por favor ingresa un nombre");
            
            localStorage.setItem(`quiniela_name_${currentUser.uid}`, name);
            document.getElementById('user-display').textContent = `Jugando como: ${name}`;
            document.getElementById(' has class 'hidden' -> document.getElementById('login-modal').classList.add('hidden');
            
            // Guardar usuario en Firestore para el leaderboard
            await setDoc(doc(db, "users", currentUser.uid), {
                name: name,
                uid: currentUser.uid,
                lastActive: new Date()
            }, { merge: true });
            
            initApp();
        }

        // ==========================================
        // 3. LÓGICA DE LA APP EN TIEMPO REAL
        // ==========================================
        function initApp() {
            // Escuchar cambios en partidos (en tiempo real)
            onSnapshot(collection(db, "matches"), (snapshot) => {
                matchesData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                calculateAndRender();
            });

            // Escuchar cambios en predicciones (en tiempo real)
            onSnapshot(collection(db, "predictions"), (snapshot) => {
                predictionsData = {};
                snapshot.docs.forEach(doc => {
                    predictionsData[doc.id] = doc.data();
                });
                calculateAndRender();
            });
        }

        function calculateAndRender() {
            if (matchesData.length === 0) return;

            // 1. Calcular puntajes de todos los usuarios
            let leaderboard = {};
            
            matchesData.forEach(match => {
                const isFinished = match.status === "finished";
                
                // Buscar predicción del usuario actual para este partido
                const predKey = `${currentUser.uid}_${match.id}`;
                const myPred = predictionsData[predKey];
                
                if (myPred) {
                    match.myHome = myPred.home;
                    match.myAway = myPred.away;
                } else {
                    match.myHome = null;
                    match.myAway = null;
                }

                // Calcular puntos para TODOS los usuarios que hayan predicho este partido
                Object.keys(predictionsData).forEach(key => {
                    if (!key.endsWith(`_${match.id}`)) return;
                    
                    const [uid] = key.split('_');
                    const pred = predictionsData[key];
                    
                    if (!leaderboard[uid]) leaderboard[uid] = { name: "Cargando...", exacts: 0, winners: 0, score: 0 };

                    if (isFinished && pred.home !== null && pred.away !== null) {
                        if (pred.home === match.homeScore && pred.away === match.awayScore) {
                            leaderboard[uid].score += 4;
                            leaderboard[uid].exacts += 1;
                            if (uid === currentUser.uid) match.resultClass = "exact-match";
                        } else if (
                            (pred.home > pred.away && match.homeScore > match.awayScore) || 
                            (pred.home < pred.away && match.homeScore < match.awayScore) || 
                            (pred.home === pred.away && match.homeScore === match.awayScore)
                        ) {
                            leaderboard[uid].score += 3;
                            leaderboard[uid].winners += 1;
                            if (uid === currentUser.uid && !match.resultClass) match.resultClass = "winner-match";
                        } else {
                            if (uid === currentUser.uid && !match.resultClass) match.resultClass = "lost-match";
                        }
                    }
                });
            });

            // Obtener nombres para el leaderboard
            getDocs(collection(db, "users")).then(snapshot => {
                snapshot.docs.forEach(doc => {
                    if (leaderboard[doc.id]) {
                        leaderboard[doc.id].name = doc.data().name;
                    }
                });
                
                // Convertir a array y ordenar
                const sortedLeaderboard = Object.values(leaderboard).sort((a, b) => b.score - a.score);
                renderLeaderboard(sortedLeaderboard);
                renderMatches();
            });
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboard-body');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-slate-500">Aún no hay predicciones. ¡Sé el primero!</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((p, index) => {
                const isMe = p.name === localStorage.getItem(`quiniela_name_${currentUser.uid}`);
                return `
                <tr class="hover:bg-slate-700/50 transition ${isMe ? 'bg-emerald-900/20' : ''}">
                    <td class="px-3 py-3 font-bold ${index === 0 ? 'text-yellow-400' : 'text-slate-400'}">#${index + 1}</td>
                    <td class="px-3 py-3 font-medium text-white">${p.name} ${isMe ? '(Tú)' : ''} ${index === 0 ? '👑' : ''}</td>
                    <td class="px-3 py-3 text-center text-emerald-400 font-bold">${p.exacts}</td>
                    <td class="px-3 py-3 text-center text-yellow-400">${p.winners}</td>
                    <td class="px-3 py-3 text-right font-bold text-lg text-emerald-400">${p.score}</td>
                </tr>
            `}).join('');
        }

        function renderMatches() {
            const container = document.getElementById('matches-container');
            const grouped = matchesData.reduce((acc, match) => {
                if (!acc[match.group]) acc[match.group] = [];
                acc[match.group].push(match);
                return acc;
            }, {});

            container.innerHTML = Object.keys(grouped).map(group => `
                <div>
                    <h3 class="text-emerald-400 font-bold text-lg mb-3 flex items-center gap-2">
                        <span class="bg-emerald-900/50 px-3 py-1 rounded-full text-sm border border-emerald-700">GRUPO ${group}</span>
                    </h3>
                    <div class="space-y-3">
                        ${grouped[group].map(match => {
                            const isFinished = match.status === "finished";
                            const resultClass = match.resultClass || "border-slate-700";
                            const actualScore = isFinished ? `<span class="text-xs text-slate-400 block mt-1">Final: ${match.homeScore} - ${match.awayScore}</span>` : '';
                            const myH = match.myHome !== null ? match.myHome : '';
                            const myA = match.myAway !== null ? match.myAway : '';
                            
                            return `
                            <div class="match-card bg-slate-800 rounded-lg p-4 border ${resultClass} flex flex-col sm:flex-row items-center justify-between gap-4">
                                <div class="flex-1 text-center sm:text-right w-full sm:w-auto">
                                    <div class="font-bold text-lg">${match.homeTeam}</div>
                                </div>
                                
                                <div class="flex items-center gap-3 bg-slate-900 px-4 py-2 rounded-lg border border-slate-700">
                                    <input type="number" min="0" max="9" class="score-input" 
                                        value="${myH}" 
                                        onchange="window.savePrediction('${match.id}', 'home', this.value)"
                                        ${isFinished ? 'disabled' : ''}>
                                    <span class="text-slate-500 font-bold">-</span>
                                    <input type="number" min="0" max="9" class="score-input" 
                                        value="${myA}" 
                                        onchange="window.savePrediction('${match.id}', 'away', this.value)"
                                        ${isFinished ? 'disabled' : ''}>
                                </div>

                                <div class="flex-1 text-center sm:text-left w-full sm:w-auto">
                                    <div class="font-bold text-lg">${match.awayTeam}</div>
                                    <div class="text-xs text-slate-500 mt-1">${match.date} ${actualScore}</div>
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        // ==========================================
        // 4. FUNCIONES GLOBALES (Para que el HTML las vea)
        // ==========================================
        window.savePrediction = async function(matchId, team, value) {
            if (!currentUser) return;
            
            const predKey = `${currentUser.uid}_${matchId}`;
            const match = matchesData.find(m => m.id === matchId);
            
            // Obtener el valor actual del otro equipo para guardar el objeto completo
            const currentPred = predictionsData[predKey] || { home: null, away: null };
            const newHome = team === 'home' ? (value === '' ? null : parseInt(value)) : currentPred.home;
            const newAway = team === 'away' ? (value === '' ? null : parseInt(value)) : currentPred.away;

            await setDoc(doc(db, "predictions", predKey), {
                userId: currentUser.uid,
                matchId: matchId,
                home: newHome,
                away: newAway,
                updatedAt: new Date()
            });
            // El onSnapshot se encargará de recalcular y renderizar automáticamente
        }

        window.seedDatabase = async function() {
            if (!confirm("¿Inicializar partidos de ejemplo en la base de datos? (Solo hacer 1 vez)")) return;
            
            const batch = writeBatch(db);
            const initialMatches = [
                { id: "101", group: "A", homeTeam: "🇲🇽 México", awayTeam: "🇿🇦 Sudáfrica", date: "11/06 21:00", status: "finished", homeScore: 2, awayScore: 1 },
                { id: "102", group: "A", homeTeam: "🇰🇷 Corea del Sur", awayTeam: "🇨🇿 Rep. Checa", date: "12/06 04:00", status: "scheduled", homeScore: null, awayScore: null },
                { id: "103", group: "B", homeTeam: "🇨🇦 Canadá", awayTeam: "🇧🇦 Bosnia", date: "12/06 21:00", status: "finished", homeScore: 1, awayScore: 1 },
                { id: "104", group: "C", homeTeam: "🇧🇷 Brasil", awayTeam: "🇲🇦 Marruecos", date: "14/06 00:00", status: "scheduled", homeScore: null, awayScore: null }
            ];

            initialMatches.forEach(m => {
                batch.set(doc(db, "matches", m.id), m);
            });
            
            await batch.commit();
            alert("✅ Base de datos inicializada con éxito. Refresca la página.");
        }

        window.fetchRealResults = async function() {
            const icon = document.getElementById('sync-icon');
            icon.classList.add('fa-spin');
            
            // AQUÍ IRÍA LA LLAMADA A API-FOOTBALL (Como en la versión anterior)
            // Por ahora, simulamos que el partido 102 terminó
            setTimeout(async () => {
                const matchRef = doc(db, "matches", "102");
                // Solo actualizar si está programado
                // En producción, aquí harías el fetch a la API y actualizarías los que estén "finished"
                alert("🔄 Simulando conexión a API... (En producción, esto traería los resultados reales)");
                icon.classList.remove('fa-spin');
            }, 1000);
        }
    </script>
</body>
</html>
